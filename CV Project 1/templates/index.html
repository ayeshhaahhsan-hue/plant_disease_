<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Disease Detection</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 20px;
            width: 60%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        input[type=file] {
            margin: 15px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        img {
            margin-top: 20px;
            width: 250px;
            border-radius: 10px;
        }

        .result {
            margin-top: 20px;
            text-align: left;
        }

        .box {
            background: #f8f8f8;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🌿 Plant Disease Detection AI</h1>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">Analyze Image</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if image_path %}
        <h3>Uploaded Image:</h3>
        <img src="{{ url_for('static', filename='uploads/' + image_path) }}">
    {% endif %}

    {% if disease %}
    <div class="result">

        <h2>🦠 Disease:</h2>
        <div class="box">{{ disease }}</div>

        <h2>💊 Treatment:</h2>
        <div class="box">{{ treatment }}</div>

        <h2>🌱 Nutrients:</h2>
        <div class="box">{{ nutrients }}</div>

    </div>
    {% endif %}

</div>

</body>
</html>
